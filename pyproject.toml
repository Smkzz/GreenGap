[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greengap"
dynamic = ["version"]
description = "Archived Plan-mode analyzer for finding pytest tests omitted from GitHub Actions CI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "GreenGap contributors" }]
keywords = ["ci", "github-actions", "pytest", "testing", "static-analysis"]
urls = { Homepage = "https://github.com/Smkzz/GreenGap", Repository = "https://github.com/Smkzz/GreenGap", Changelog = "https://github.com/Smkzz/GreenGap/blob/main/CHANGELOG.md", "Related runtime project" = "https://github.com/Smkzz/pytest-run-witness" }
dependencies = ["PyYAML>=6.0", "defusedxml>=0.7.1"]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.scripts]
greengap = "greengap.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=9.0.3",
  "ruff>=0.5",
  "types-defusedxml>=0.7.0.20260504",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "greengap.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["greengap"]
strict = true
warn_unused_configs = true
exclude = ["^tests/"]

[tool.coverage.run]
branch = true
source = ["greengap"]
