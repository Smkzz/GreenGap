name: GreenGap CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src

defaults:
  run:
    shell: bash

concurrency:
  group: greengap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            dependencies: minimum
          - os: ubuntu-24.04
            python-version: "3.12"
            dependencies: latest
          - os: ubuntu-24.04
            python-version: "3.13"
            dependencies: latest
          - os: ubuntu-24.04
            python-version: "3.14"
            dependencies: latest
          - os: windows-2025
            python-version: "3.11"
            dependencies: latest
          - os: windows-2025
            python-version: "3.14"
            dependencies: latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimum dependency lane
        if: matrix.dependencies == 'minimum'
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements-ci-minimum.txt
      - name: Install latest dependency lane
        if: matrix.dependencies == 'latest'
        run: |
          python -m pip install --require-hashes -r .github/requirements-ci-latest.txt
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check src tests
      - name: Run mypy
        run: python -m mypy src
      - name: Compile source
        run: python -m compileall -q src tests

  runtime-witness:
    name: runtime witness / ubuntu-24.04 / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned CI test environment
        run: python -m pip install --require-hashes -r .github/requirements-ci-latest.txt
      - name: Bind the exact checkout
        id: witness_source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "${source_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${source_tree}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "source_tree=${source_tree}" >> "${GITHUB_OUTPUT}"
      - name: Collect the complete pytest denominator
        id: witness_collect
        run: |
          set +e
          witness_root="${RUNNER_TEMP}/greengap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${witness_root}/collection"
          python -m greengap witness collect . \
            --output-dir "${witness_root}/collection" \
            --source-commit "${{ steps.witness_source.outputs.source_sha }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --surface-id "ubuntu-24.04-py3.11-collection" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            -- python -m pytest > "${witness_root}/collection-command.json"
          status=$?
          set -e
          cat "${witness_root}/collection-command.json"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Execute the real pytest command under Witness
        id: witness_execute
        run: |
          set +e
          witness_root="${RUNNER_TEMP}/greengap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${witness_root}/execution"
          python -m greengap witness run . \
            --output-dir "${witness_root}/execution" \
            --source-commit "${{ steps.witness_source.outputs.source_sha }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --surface-id "ubuntu-24.04-py3.11-execution" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            -- python -m pytest > "${witness_root}/execution-command.json"
          status=$?
          set -e
          cat "${witness_root}/execution-command.json"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Create the declared witness manifest
        if: ${{ always() }}
        run: |
          set -euo pipefail
          witness_root="${RUNNER_TEMP}/greengap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mapfile -t collection_files < <(find "${witness_root}/collection" -maxdepth 1 -type f -name 'greengap-*.json' -print)
          [[ "${#collection_files[@]}" -eq 1 ]]
          python -m greengap witness manifest \
            --collection-witness "${collection_files[0]}" \
            --execution-witness-id "ubuntu-24.04-py3.11-execution|-" \
            --output "${witness_root}/manifest.json"
      - name: Analyze the complete witness set
        if: ${{ always() }}
        run: |
          set +e
          witness_root="${RUNNER_TEMP}/greengap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m greengap witness analyze \
            --manifest "${witness_root}/manifest.json" \
            --collection-witness "${witness_root}/collection" \
            --execution-witness "${witness_root}/execution" \
            --json > "${witness_root}/analysis.json"
          status=$?
          set -e
          if [[ -f "${witness_root}/analysis.json" ]]; then
            cat "${witness_root}/analysis.json"
          fi
          exit "${status}"
      - name: Require a complete, gap-free witness result
        run: |
          python -c "import json; from pathlib import Path; root=Path(r'${RUNNER_TEMP}') / f'greengap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'; analysis=json.loads((root/'analysis.json').read_text()); execution=json.loads((root/'execution-command.json').read_text()); assert analysis['complete'] is True and analysis['outcome'] == 'COMPLETE' and not analysis['errors'] and not analysis['not_run_files']; assert execution['complete'] is True and execution['command_exit_status'] == 0; print('RUNTIME_WITNESS_REMOTE_VALIDATION=PASS')"
      - name: Stage the inert witness evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          witness_root="${RUNNER_TEMP}/greengap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p runtime-witness/collection runtime-witness/execution
          if [[ -d "${witness_root}/collection" ]]; then cp -a "${witness_root}/collection/." runtime-witness/collection/; fi
          if [[ -d "${witness_root}/execution" ]]; then cp -a "${witness_root}/execution/." runtime-witness/execution/; fi
          for name in collection-command.json execution-command.json manifest.json analysis.json; do
            if [[ -f "${witness_root}/${name}" ]]; then cp "${witness_root}/${name}" "runtime-witness/${name}"; fi
          done
          find runtime-witness -type f -print
      - name: Upload the inert witness evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-witness-${{ github.run_id }}
          path: runtime-witness
          if-no-files-found: error
          retention-days: 7

  package:
    name: package / wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --require-hashes -r .github/requirements-package.txt
          python -m build --no-isolation
          python -m twine check dist/*
      - name: Inspect wheel contents and install exact wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -F greengap/__init__.py
          python -m pip install --require-hashes -r .github/requirements-runtime.txt
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          greengap --version
      - name: Inspect and install exact sdist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sdist-extract
          mkdir sdist-extract
          archive="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "${archive}"
          tar -xzf "${archive}" -C sdist-extract
          source_root="$(find sdist-extract -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "${source_root}/tests/__init__.py"
          test -f "${source_root}/tests/conftest.py"
          test -f "${source_root}/scripts/create_release_provenance.py"
          (
            cd "${source_root}"
            python -m compileall -q src tests scripts
            python -c "from scripts.create_release_provenance import create_manifest; print(create_manifest.__name__)"
          )
          archive_path="$(realpath "${archive}")"
          archive_hash="$(sha256sum "${archive_path}" | cut -d ' ' -f1)"
          printf 'greengap @ file://%s --hash=sha256:%s\n' "${archive_path}" "${archive_hash}" > sdist-requirements.txt
          python -m pip install --force-reinstall --no-deps --no-build-isolation --require-hashes -r sdist-requirements.txt
          python -m pip check
          greengap --version

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Audit dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements-audit.txt
          python -m pip_audit
