name: GreenGap CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src

defaults:
  run:
    shell: bash

concurrency:
  group: greengap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            dependencies: minimum
          - os: ubuntu-24.04
            python-version: "3.12"
            dependencies: latest
          - os: ubuntu-24.04
            python-version: "3.13"
            dependencies: latest
          - os: ubuntu-24.04
            python-version: "3.14"
            dependencies: latest
          - os: windows-2025
            python-version: "3.11"
            dependencies: latest
          - os: windows-2025
            python-version: "3.14"
            dependencies: latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimum dependency lane
        if: matrix.dependencies == 'minimum'
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements-ci-minimum.txt
      - name: Install latest dependency lane
        if: matrix.dependencies == 'latest'
        run: |
          python -m pip install --require-hashes -r .github/requirements-ci-latest.txt
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check src tests
      - name: Run mypy
        run: python -m mypy src
      - name: Compile source
        run: python -m compileall -q src tests

  runtime-witness:
    name: runtime witness / ubuntu-24.04 / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned CI test environment
        run: python -m pip install --require-hashes -r .github/requirements-ci-latest.txt
      - name: Bind the exact checkout
        id: witness_source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "${source_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${source_tree}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "source_tree=${source_tree}" >> "${GITHUB_OUTPUT}"
      - name: Bind the exact witness configuration
        id: witness_config
        run: |
          set -euo pipefail
          config_sha256="$(sha256sum .greengap.yml | cut -d ' ' -f1)"
          [[ "${config_sha256}" =~ ^[0-9a-fA-F]{64}$ ]]
          echo "config_sha256=${config_sha256}" >> "${GITHUB_OUTPUT}"
      - name: Collect the complete pytest denominator
        id: witness_collect
        env:
          GREENGAP_WITNESS_DIR: ${{ runner.temp }}/greengap-${{ github.run_id }}-${{ github.run_attempt }}/collection
          GREENGAP_SURFACE_ID: ubuntu-24.04-py3.11-collection
          GREENGAP_SOURCE_SHA: ${{ steps.witness_source.outputs.source_sha }}
          GREENGAP_RUN_ID: ${{ github.run_id }}
          GREENGAP_RUN_ATTEMPT: ${{ github.run_attempt }}
          GREENGAP_JOB_ID: runtime-witness-collection
          GREENGAP_REPOSITORY: ${{ github.repository }}
          GREENGAP_WITNESS_ROLE: collection
          GREENGAP_PROVIDER: github_actions
          GREENGAP_CONFIG_SHA256: ${{ steps.witness_config.outputs.config_sha256 }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          mkdir -p "${GREENGAP_WITNESS_DIR}"
          timeout --signal=TERM --kill-after=30s 600s python -m pytest -p greengap.pytest_witness --collect-only --greengap-full-collection
      - name: Execute the real pytest command under Witness
        id: witness_execute
        env:
          GREENGAP_WITNESS_DIR: ${{ runner.temp }}/greengap-${{ github.run_id }}-${{ github.run_attempt }}/execution
          GREENGAP_SURFACE_ID: ubuntu-24.04-py3.11-execution
          GREENGAP_SOURCE_SHA: ${{ steps.witness_source.outputs.source_sha }}
          GREENGAP_RUN_ID: ${{ github.run_id }}
          GREENGAP_RUN_ATTEMPT: ${{ github.run_attempt }}
          GREENGAP_JOB_ID: runtime-witness-execution
          GREENGAP_REPOSITORY: ${{ github.repository }}
          GREENGAP_WITNESS_ROLE: execution
          GREENGAP_PROVIDER: github_actions
          GREENGAP_CONFIG_SHA256: ${{ steps.witness_config.outputs.config_sha256 }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          mkdir -p "${GREENGAP_WITNESS_DIR}"
          timeout --signal=TERM --kill-after=30s 600s python -m pytest -p greengap.pytest_witness
      - name: Create the declared witness manifest
        if: ${{ always() }}
        run: |
          set -euo pipefail
          witness_root="${RUNNER_TEMP}/greengap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mapfile -t collection_files < <(find "${witness_root}/collection" -type f -name 'greengap-*.json' -print)
          [[ "${#collection_files[@]}" -eq 1 ]]
          python -m greengap witness manifest \
            --collection-witness "${collection_files[0]}" \
            --config .greengap.yml \
            --output "${witness_root}/manifest.json"
      - name: Analyze the complete witness set
        if: ${{ always() }}
        run: |
          set +e
          witness_root="${RUNNER_TEMP}/greengap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -m greengap witness analyze \
            --manifest "${witness_root}/manifest.json" \
            --collection-witness "${witness_root}/collection" \
            --execution-witness "${witness_root}/execution" \
            --json > "${witness_root}/analysis.json"
          status=$?
          set -e
          if [[ -f "${witness_root}/analysis.json" ]]; then
            cat "${witness_root}/analysis.json"
          fi
          exit "${status}"
      - name: Require a complete, gap-free witness result
        run: |
          python -c "import json; from pathlib import Path; root=Path(r'${RUNNER_TEMP}') / f'greengap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'; analysis=json.loads((root/'analysis.json').read_text()); assert analysis['complete'] is True and analysis['outcome'] == 'COMPLETE' and not analysis['errors'] and not analysis['not_run_files']; print('RUNTIME_WITNESS_REMOTE_VALIDATION=PASS')"
      - name: Stage the inert witness evidence
        if: ${{ always() }}
        run: |
          set -euo pipefail
          witness_root="${RUNNER_TEMP}/greengap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf runtime-witness
          mkdir -p runtime-witness/collection runtime-witness/execution
          copy_fragments() {
            local source_dir="$1"
            local destination_dir="$2"
            [[ -d "${source_dir}" ]] || return 0
            shopt -s nullglob
            local fragments=("${source_dir}"/greengap-*.json)
            for fragment in "${fragments[@]}"; do
              [[ -f "${fragment}" && ! -L "${fragment}" ]] || { echo "unexpected witness input: ${fragment}" >&2; return 1; }
              cp -- "${fragment}" "${destination_dir}/"
            done
          }
          copy_fragments "${witness_root}/collection" runtime-witness/collection
          copy_fragments "${witness_root}/execution" runtime-witness/execution
          for name in manifest.json analysis.json; do
            if [[ -f "${witness_root}/${name}" ]]; then cp "${witness_root}/${name}" "runtime-witness/${name}"; fi
          done
          find runtime-witness -type f -print
      - name: Upload the inert witness evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-witness-${{ github.run_id }}
          path: runtime-witness
          if-no-files-found: error
          retention-days: 7

  runtime-fixtures:
    name: runtime witness / explicit reference fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned fixture validation environment
        run: python -m pip install --require-hashes -r .github/requirements-ci-latest.txt
      - name: Validate direct pytest and matrix-shard contracts
        run: |
          set -euo pipefail
          python scripts/validate_reference_fixtures.py \
            --fixture direct-pytest \
            --output "${RUNNER_TEMP}/greengap-reference-direct"
          python scripts/validate_reference_fixtures.py \
            --fixture matrix-shards \
            --output "${RUNNER_TEMP}/greengap-reference-matrix"

  package:
    name: package / wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --require-hashes -r .github/requirements-package.txt
          python -m build --no-isolation
          python -m twine check dist/*
      - name: Inspect wheel contents and install exact wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -F greengap/__init__.py
          python -m pip install --require-hashes -r .github/requirements-runtime.txt
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          greengap --version
      - name: Inspect and install exact sdist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sdist-extract
          mkdir sdist-extract
          archive="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "${archive}"
          tar -xzf "${archive}" -C sdist-extract
          source_root="$(find sdist-extract -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "${source_root}/tests/__init__.py"
          test -f "${source_root}/tests/conftest.py"
          test -f "${source_root}/scripts/create_release_provenance.py"
          (
            cd "${source_root}"
            python -m compileall -q src tests scripts
            python -c "from scripts.create_release_provenance import create_manifest; print(create_manifest.__name__)"
          )
          archive_path="$(realpath "${archive}")"
          archive_hash="$(sha256sum "${archive_path}" | cut -d ' ' -f1)"
          printf 'greengap @ file://%s --hash=sha256:%s\n' "${archive_path}" "${archive_hash}" > sdist-requirements.txt
          python -m pip install --force-reinstall --no-deps --no-build-isolation --require-hashes -r sdist-requirements.txt
          python -m pip check
          greengap --version

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Audit dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements-audit.txt
          python -m pip_audit
