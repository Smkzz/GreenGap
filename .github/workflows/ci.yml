name: GreenGap CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: greengap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            dependencies: minimum
          - os: ubuntu-24.04
            python-version: "3.12"
            dependencies: latest
          - os: ubuntu-24.04
            python-version: "3.13"
            dependencies: latest
          - os: ubuntu-24.04
            python-version: "3.14"
            dependencies: latest
          - os: windows-2025
            python-version: "3.11"
            dependencies: latest
          - os: windows-2025
            python-version: "3.14"
            dependencies: latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimum dependency lane
        if: matrix.dependencies == 'minimum'
        shell: bash
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install --no-deps .
          python -m pip install "PyYAML==6.0.3" "build==1.5.0" "mypy==1.19.1" "pytest==8.4.2" "ruff==0.12.11" "types-PyYAML==6.0.12.20260724"
      - name: Install latest dependency lane
        if: matrix.dependencies == 'latest'
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install ".[dev]" "PyYAML==6.0.3" "build==1.5.0" "mypy==1.19.1" "pytest==9.0.3" "ruff==0.12.11" "types-PyYAML==6.0.12.20260724"
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check src tests
      - name: Run mypy
        run: python -m mypy src
      - name: Compile source
        run: python -m compileall -q src tests

  package:
    name: package / wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip==26.2.1 build==1.5.0 twine==7.0.0
          python -m build
          python -m twine check dist/*
      - name: Inspect wheel contents and install exact wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -F greengap/__init__.py
          python -m pip install "PyYAML==6.0.3"
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          greengap --version
      - name: Inspect and install exact sdist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sdist-extract
          mkdir sdist-extract
          archive="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "${archive}"
          tar -xzf "${archive}" -C sdist-extract
          source_root="$(find sdist-extract -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "${source_root}/tests/__init__.py"
          test -f "${source_root}/tests/conftest.py"
          test -f "${source_root}/scripts/create_release_provenance.py"
          (
            cd "${source_root}"
            python -m compileall -q src tests scripts
            python -c "from scripts.create_release_provenance import create_manifest; print(create_manifest.__name__)"
          )
          python -m pip install --force-reinstall --no-deps --no-build-isolation "${archive}"
          python -m pip check
          greengap --version

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Audit dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1 pip-audit==2.10.1
          python -m pip install ".[dev]" "PyYAML==6.0.3" "build==1.5.0" "mypy==1.19.1" "pytest==9.0.3" "ruff==0.12.11" "types-PyYAML==6.0.12.20260724"
          python -m pip_audit
