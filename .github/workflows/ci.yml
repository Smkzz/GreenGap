name: GreenGap CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: greengap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            dependencies: minimum
          - os: ubuntu-24.04
            python-version: "3.12"
            dependencies: latest
          - os: ubuntu-24.04
            python-version: "3.13"
            dependencies: latest
          - os: ubuntu-24.04
            python-version: "3.14"
            dependencies: latest
          - os: windows-2025
            python-version: "3.11"
            dependencies: latest
          - os: windows-2025
            python-version: "3.14"
            dependencies: latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimum dependency lane
        if: matrix.dependencies == 'minimum'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .
          python -m pip install "PyYAML>=6.0,<6.1" "build>=1.2,<2" "mypy>=1.10,<2" "pytest>=8.0,<9" "ruff>=0.5,<1" "types-PyYAML>=6.0"
      - name: Install latest dependency lane
        if: matrix.dependencies == 'latest'
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check src tests
      - name: Run mypy
        run: python -m mypy src
      - name: Compile source
        run: python -m compileall -q src tests

  package:
    name: package / wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Inspect wheel contents and install exact wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -F greengap/__init__.py
          python -m pip install "PyYAML>=6.0"
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          greengap --version

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Audit dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install ".[dev]"
          python -m pip_audit
