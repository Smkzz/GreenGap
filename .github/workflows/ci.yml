name: GreenGap CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src

defaults:
  run:
    shell: bash

concurrency:
  group: greengap-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            dependencies: minimum
          - os: ubuntu-24.04
            python-version: "3.12"
            dependencies: latest
          - os: ubuntu-24.04
            python-version: "3.13"
            dependencies: latest
          - os: ubuntu-24.04
            python-version: "3.14"
            dependencies: latest
          - os: windows-2025
            python-version: "3.11"
            dependencies: latest
          - os: windows-2025
            python-version: "3.14"
            dependencies: latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install minimum dependency lane
        if: matrix.dependencies == 'minimum'
        shell: bash
        run: |
          python -m pip install --require-hashes -r .github/requirements-ci-minimum.txt
      - name: Install latest dependency lane
        if: matrix.dependencies == 'latest'
        run: |
          python -m pip install --require-hashes -r .github/requirements-ci-latest.txt
      - name: Run tests
        run: python -m pytest
      - name: Run Ruff
        run: python -m ruff check src tests
      - name: Run mypy
        run: python -m mypy src
      - name: Compile source
        run: python -m compileall -q src tests

  runtime-witness:
    name: runtime witness / ubuntu-24.04 / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned CI test environment
        run: python -m pip install --require-hashes -r .github/requirements-ci-latest.txt
      - name: Bind the exact checkout
        id: witness_source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "${source_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${source_tree}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "source_tree=${source_tree}" >> "${GITHUB_OUTPUT}"
      - name: Bind the exact witness configuration
        id: witness_config
        run: |
          set -euo pipefail
          config_sha256="$(sha256sum .greengap.yml | cut -d ' ' -f1)"
          [[ "${config_sha256}" =~ ^[0-9a-fA-F]{64}$ ]]
          echo "config_sha256=${config_sha256}" >> "${GITHUB_OUTPUT}"
      - name: Collect the complete pytest denominator
        id: witness_collect
        env:
          GREENGAP_WITNESS_DIR: ${{ runner.temp }}/greengap-${{ github.run_id }}-${{ github.run_attempt }}/collection
          GREENGAP_SURFACE_ID: ubuntu-24.04-py3.11-collection
          GREENGAP_SOURCE_SHA: ${{ steps.witness_source.outputs.source_sha }}
          GREENGAP_RUN_ID: ${{ github.run_id }}
          GREENGAP_RUN_ATTEMPT: ${{ github.run_attempt }}
          GREENGAP_JOB_ID: runtime-witness-collection
          GREENGAP_REPOSITORY: ${{ github.repository }}
          GREENGAP_WITNESS_ROLE: collection
          GREENGAP_PROVIDER: github_actions
          GREENGAP_CONFIG_SHA256: ${{ steps.witness_config.outputs.config_sha256 }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          mkdir -p "${GREENGAP_WITNESS_DIR}"
          timeout --signal=TERM --kill-after=30s 600s python -m pytest -p greengap.pytest_witness --collect-only --greengap-full-collection
      - name: Execute the real pytest command under Witness
        id: witness_execute
        env:
          GREENGAP_WITNESS_DIR: ${{ runner.temp }}/greengap-${{ github.run_id }}-${{ github.run_attempt }}/execution
          GREENGAP_SURFACE_ID: ubuntu-24.04-py3.11-execution
          GREENGAP_SOURCE_SHA: ${{ steps.witness_source.outputs.source_sha }}
          GREENGAP_RUN_ID: ${{ github.run_id }}
          GREENGAP_RUN_ATTEMPT: ${{ github.run_attempt }}
          GREENGAP_JOB_ID: runtime-witness-execution
          GREENGAP_REPOSITORY: ${{ github.repository }}
          GREENGAP_WITNESS_ROLE: execution
          GREENGAP_PROVIDER: github_actions
          GREENGAP_CONFIG_SHA256: ${{ steps.witness_config.outputs.config_sha256 }}
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -euo pipefail
          mkdir -p "${GREENGAP_WITNESS_DIR}"
          timeout --signal=TERM --kill-after=30s 600s python -m pytest -p greengap.pytest_witness
      - name: Stage the bounded witness evidence
        if: ${{ always() }}
        env:
          WITNESS_COLLECTION_OUTCOME: ${{ steps.witness_collect.outcome }}
          WITNESS_EXECUTION_OUTCOME: ${{ steps.witness_execute.outcome }}
        run: |
          set -euo pipefail
          witness_root="${RUNNER_TEMP}/greengap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/witness_artifact.py stage \
            --source-root "${witness_root}" \
            --destination-root runtime-witness \
            --collection-outcome "${WITNESS_COLLECTION_OUTCOME}" \
            --execution-outcome "${WITNESS_EXECUTION_OUTCOME}"
      - name: Create the declared witness manifest
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mapfile -t collection_files < <(find runtime-witness/collection -maxdepth 1 -type f -name 'greengap-*.json' -print)
          [[ "${#collection_files[@]}" -eq 1 ]]
          python -m greengap witness manifest \
            --collection-witness "${collection_files[0]}" \
            --config .greengap.yml \
            --output runtime-witness/manifest.json
      - name: Record the exact analyzer inputs
        if: ${{ always() }}
        run: python scripts/witness_artifact.py inventory --artifact-root runtime-witness
      - name: Analyze the complete witness set
        if: ${{ always() }}
        env:
          WITNESS_COLLECTION_OUTCOME: ${{ steps.witness_collect.outcome }}
          WITNESS_EXECUTION_OUTCOME: ${{ steps.witness_execute.outcome }}
        run: |
          set -euo pipefail
          if [[ "${WITNESS_COLLECTION_OUTCOME}" != "success" || "${WITNESS_EXECUTION_OUTCOME}" != "success" ]]; then
            echo "RUNTIME_WITNESS_COMMAND_OUTCOME_NOT_SUCCESS collection=${WITNESS_COLLECTION_OUTCOME} execution=${WITNESS_EXECUTION_OUTCOME}" >&2
            exit 2
          fi
          set +e
          python -m greengap witness analyze \
            --manifest runtime-witness/manifest.json \
            --collection-witness runtime-witness/collection \
            --execution-witness runtime-witness/execution \
            --json > runtime-witness/analysis.json
          status=$?
          set -e
          if [[ -f runtime-witness/analysis.json ]]; then
            cat runtime-witness/analysis.json
          fi
          exit "${status}"
      - name: Require a complete, gap-free witness result
        run: |
          python -c "import json; from pathlib import Path; root=Path('runtime-witness'); analysis=json.loads((root/'analysis.json').read_text()); assert analysis['complete'] is True and analysis['outcome'] == 'COMPLETE' and not analysis['errors'] and not analysis['not_run_files']; print('RUNTIME_WITNESS_REMOTE_VALIDATION=PASS')"
      - name: Seal the analyzed evidence set
        id: witness_integrity
        if: ${{ always() }}
        run: |
          set -euo pipefail
          digest="$(python scripts/witness_artifact.py seal --artifact-root runtime-witness)"
          [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
      - name: Upload the inert witness evidence
        id: witness_upload
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-witness
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Fetch the exact artifact archive through the GitHub API
        if: ${{ always() }}
        env:
          ARTIFACT_ID: ${{ steps.witness_upload.outputs.artifact-id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          umask 077
          archive="${RUNNER_TEMP}/runtime-witness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output "${archive}"
      - name: Verify the exact uploaded artifact bytes
        if: ${{ always() }}
        env:
          ARTIFACT_DIGEST: ${{ steps.witness_upload.outputs.artifact-digest }}
          INTEGRITY_DIGEST: ${{ steps.witness_integrity.outputs.digest }}
        run: |
          set -euo pipefail
          [[ -n "${ARTIFACT_DIGEST}" ]]
          [[ -n "${INTEGRITY_DIGEST}" ]]
          archive="${RUNNER_TEMP}/runtime-witness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          [[ -f "${archive}" ]]
          python scripts/witness_artifact.py verify \
            --archive "${archive}" \
            --artifact-digest "${ARTIFACT_DIGEST}" \
            --integrity-digest "${INTEGRITY_DIGEST}" \
            --temporary-parent "${RUNNER_TEMP}"

  runtime-fixtures:
    name: runtime witness / explicit reference fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned fixture validation environment
        run: python -m pip install --require-hashes -r .github/requirements-ci-latest.txt
      - name: Validate direct pytest and matrix-shard contracts
        run: |
          set -euo pipefail
          python scripts/validate_reference_fixtures.py \
            --fixture direct-pytest \
            --output "${RUNNER_TEMP}/greengap-reference-direct"
          python scripts/validate_reference_fixtures.py \
            --fixture matrix-shards \
            --output "${RUNNER_TEMP}/greengap-reference-matrix"

  package:
    name: package / wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --require-hashes -r .github/requirements-package.txt
          python -m build --no-isolation
          python -m twine check dist/*
      - name: Inspect wheel contents and install exact wheel
        run: |
          python -m zipfile -l dist/*.whl | grep -F greengap/__init__.py
          python -m pip install --require-hashes -r .github/requirements-runtime.txt
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          greengap --version
      - name: Inspect and install exact sdist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sdist-extract
          mkdir sdist-extract
          archive="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "${archive}"
          tar -xzf "${archive}" -C sdist-extract
          source_root="$(find sdist-extract -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "${source_root}/tests/__init__.py"
          test -f "${source_root}/tests/conftest.py"
          test -f "${source_root}/scripts/create_release_provenance.py"
          (
            cd "${source_root}"
            python -m compileall -q src tests scripts
            python -c "from scripts.create_release_provenance import create_manifest; print(create_manifest.__name__)"
          )
          archive_path="$(realpath "${archive}")"
          archive_hash="$(sha256sum "${archive_path}" | cut -d ' ' -f1)"
          printf 'greengap @ file://%s --hash=sha256:%s\n' "${archive_path}" "${archive_hash}" > sdist-requirements.txt
          python -m pip install --force-reinstall --no-deps --no-build-isolation --require-hashes -r sdist-requirements.txt
          python -m pip check
          greengap --version

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Audit dependencies
        run: |
          python -m pip install --require-hashes -r .github/requirements-audit.txt
          python -m pip_audit
