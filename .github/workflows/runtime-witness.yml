name: Runtime Witness validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src

defaults:
  run:
    shell: bash

jobs:
  witness:
    name: runtime witness / ubuntu-24.04 / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Install the pinned CI test environment
        run: python -m pip install --require-hashes -r .github/requirements-ci-latest.txt
      - name: Bind the exact checkout
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "${source_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${source_tree}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "source_tree=${source_tree}" >> "${GITHUB_OUTPUT}"
      - name: Collect the complete pytest denominator
        id: collect
        run: |
          set +e
          mkdir -p .greengap-witness/collection
          python -m greengap witness collect . \
            --output-dir .greengap-witness/collection \
            --source-commit "${{ steps.source.outputs.source_sha }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --surface-id "ubuntu-24.04-py3.11-collection" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            -- python -m pytest > .greengap-witness/collection-command.json
          status=$?
          set -e
          cat .greengap-witness/collection-command.json
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Execute the real pytest command under Witness
        id: execute
        run: |
          set +e
          mkdir -p .greengap-witness/execution
          python -m greengap witness run . \
            --output-dir .greengap-witness/execution \
            --source-commit "${{ steps.source.outputs.source_sha }}" \
            --repository "${GITHUB_REPOSITORY}" \
            --surface-id "ubuntu-24.04-py3.11-execution" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            -- python -m pytest > .greengap-witness/execution-command.json
          status=$?
          set -e
          cat .greengap-witness/execution-command.json
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Create the declared witness manifest
        run: |
          set -euo pipefail
          mapfile -t collection_files < <(find .greengap-witness/collection -maxdepth 1 -type f -name 'greengap-*.json' -print)
          [[ "${#collection_files[@]}" -eq 1 ]]
          python -m greengap witness manifest \
            --collection-witness "${collection_files[0]}" \
            --execution-witness-id "ubuntu-24.04-py3.11-execution|-" \
            --output .greengap-witness/manifest.json
      - name: Analyze the complete witness set
        run: |
          set -euo pipefail
          python -m greengap witness analyze \
            --manifest .greengap-witness/manifest.json \
            --collection-witness .greengap-witness/collection \
            --execution-witness .greengap-witness/execution \
            --json > .greengap-witness/analysis.json
          cat .greengap-witness/analysis.json
      - name: Require a complete, gap-free witness result
        run: |
          python -c "import json; from pathlib import Path; analysis=json.loads(Path('.greengap-witness/analysis.json').read_text()); execution=json.loads(Path('.greengap-witness/execution-command.json').read_text()); assert analysis['complete'] is True and analysis['outcome'] == 'COMPLETE' and not analysis['errors'] and not analysis['not_run_files']; assert execution['complete'] is True and execution['command_exit_status'] == 0; print('RUNTIME_WITNESS_REMOTE_VALIDATION=PASS')"
      - name: Upload the inert witness evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-witness-${{ github.run_id }}
          path: .greengap-witness
          if-no-files-found: error
          retention-days: 7
