name: OpenSSF Scorecard SARIF upload

on:
  workflow_run:
    workflows: ["OpenSSF Scorecard"]
    types: [completed]

permissions: {}

jobs:
  upload:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'schedule') &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      security-events: write
    steps:
      - name: Download exact Scorecard artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scorecard-results
          path: scorecard-artifact
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify exact Scorecard run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SCORECARD_RUN_ID: ${{ github.event.workflow_run.id }}
          SCORECARD_EVENT: ${{ github.event.workflow_run.event }}
          SCORECARD_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          receipt=scorecard-artifact/scorecard-receipt.txt
          sarif=scorecard-artifact/results.sarif
          test -f "${receipt}"
          test -s "${sarif}"
          receipt_value() {
            awk -F= -v key="$1" '$1 == key { print substr($0, index($0, "=") + 1); found = 1 } END { if (!found) exit 1 }' "${receipt}"
          }
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SCORECARD_RUN_ID}")"
          default_branch="$(jq -er '.repository.default_branch' <<<"${run_json}")"
          run_head_sha="$(jq -er '.head_sha' <<<"${run_json}")"
          test "$(jq -er '.path' <<<"${run_json}")" = .github/workflows/scorecard.yml
          test "$(jq -er '.repository.full_name' <<<"${run_json}")" = "${GITHUB_REPOSITORY}"
          test "$(jq -er '.event' <<<"${run_json}")" = "${SCORECARD_EVENT}"
          test "$(jq -er '.head_branch' <<<"${run_json}")" = "${default_branch}"
          test "${SCORECARD_RUN_HEAD_SHA}" = "${run_head_sha}"
          test "$(receipt_value SCORECARD_REPOSITORY)" = "${GITHUB_REPOSITORY}"
          test "$(receipt_value SCORECARD_EVENT)" = "${SCORECARD_EVENT}"
          test "$(receipt_value SCORECARD_RUN_ID)" = "${SCORECARD_RUN_ID}"
          test "$(receipt_value SCORECARD_HEAD_SHA)" = "${run_head_sha}"
          test "$(receipt_value SCORECARD_WORKFLOW_SHA)" = "${run_head_sha}"
          test "$(receipt_value SCORECARD_WORKFLOW_REF)" = "refs/heads/${default_branch}"
          test "$(receipt_value SCORECARD_DEFAULT_BRANCH)" = "${default_branch}"
          test "$(receipt_value SCORECARD_RESULT)" = success
          test -n "$(receipt_value SCORECARD_SARIF_SHA256)"
          test "$(receipt_value SCORECARD_SARIF_SHA256)" = "$(sha256sum "${sarif}" | awk '{print $1}')"
      - name: Upload trusted Scorecard SARIF
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28
        with:
          sarif_file: scorecard-artifact/results.sarif
