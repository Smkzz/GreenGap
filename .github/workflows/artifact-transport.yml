name: GreenGap package artifact transport

on:
  push:
    branches:
      - recovery/explicit-runtime-witness-hardening

permissions:
  contents: read

concurrency:
  group: greengap-package-transport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  produce:
    name: package producer / wheel and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      manifest: ${{ steps.manifest.outputs.payload }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip
      - name: Bind producer to the event commit
        id: source
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "${source_sha}" == "${GITHUB_SHA}" ]]
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${source_tree}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
          echo "tree=${source_tree}" >> "${GITHUB_OUTPUT}"
      - name: Build and inspect exact package distributions
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_TREE: ${{ steps.source.outputs.tree }}
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r .github/requirements-package.txt
          python -m build --no-isolation
          python -m twine check dist/*
          manifest="$(python scripts/package_transport.py create \
            --dist-dir dist \
            --source-sha "${SOURCE_SHA}" \
            --source-tree "${SOURCE_TREE}")"
          printf 'payload=%s\n' "${manifest}" >> "${GITHUB_OUTPUT}"
        id: manifest
      - name: Upload the declared package payload
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: greengap-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  consume:
    name: package consumer / independent job
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: produce
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Download the exact producer artifact by ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.produce.outputs.artifact_id }}
          path: downloaded-package
      - name: Verify byte identity, package metadata, and source binding
        env:
          EXPECTED_MANIFEST: ${{ needs.produce.outputs.manifest }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_ARTIFACT_ID: ${{ needs.produce.outputs.artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ needs.produce.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          [[ "${EXPECTED_ARTIFACT_DIGEST}" =~ ^(sha256:)?[0-9a-f]{64}$ ]]
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "${source_sha}" == "${EXPECTED_SOURCE_SHA}" ]]
          python scripts/package_transport.py verify \
            --artifact-dir downloaded-package \
            --expected-manifest-json "${EXPECTED_MANIFEST}" \
            --source-sha "${source_sha}" \
            --source-tree "${source_tree}"
          {
            echo "## Package artifact transport"
            echo "Source SHA: ${source_sha}"
            echo "Source tree: ${source_tree}"
            echo "Artifact ID: ${EXPECTED_ARTIFACT_ID}"
            echo "GitHub artifact digest: ${EXPECTED_ARTIFACT_DIGEST}"
          } >> "${GITHUB_STEP_SUMMARY}"
