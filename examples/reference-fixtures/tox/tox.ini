[tox]
env_list = collection, execution

[testenv]
package = skip
deps =
    pytest>=8,<10
    PyYAML>=6.0
pass_env =
    PYTHONPATH
    GREENGAP_WITNESS_DIR
    GREENGAP_SURFACE_ID
    GREENGAP_SOURCE_SHA
    GREENGAP_RUN_ID
    GREENGAP_RUN_ATTEMPT
    GREENGAP_JOB_ID
    GREENGAP_PROVIDER
    GREENGAP_WITNESS_ROLE
commands =
    python -m pytest -p greengap.pytest_witness --greengap-witness-role {env:GREENGAP_WITNESS_ROLE:execution} --greengap-surface-id {env:GREENGAP_SURFACE_ID} --greengap-source-sha {env:GREENGAP_SOURCE_SHA} --greengap-run-id {env:GREENGAP_RUN_ID} --greengap-job-id {env:GREENGAP_JOB_ID} --greengap-provider {env:GREENGAP_PROVIDER:local} {posargs}

[testenv:collection]
commands =
    python -m pytest -p greengap.pytest_witness --greengap-witness-role collection --greengap-surface-id {env:GREENGAP_SURFACE_ID} --greengap-source-sha {env:GREENGAP_SOURCE_SHA} --greengap-run-id {env:GREENGAP_RUN_ID} --greengap-job-id {env:GREENGAP_JOB_ID} --greengap-provider {env:GREENGAP_PROVIDER:local} --collect-only --greengap-full-collection {posargs}
